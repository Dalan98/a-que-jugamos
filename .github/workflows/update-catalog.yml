name: Actualizar catálogo y publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"   # cada día a las 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar la API de Steam
        if: github.event_name != 'push'
        continue-on-error: true   # si Steam falla, se publica el catálogo anterior
        run: python scripts/update_catalog.py

      - name: Guardar el catálogo nuevo
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git diff --cached --quiet || (git commit -m "Actualizar catálogo de Steam" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
